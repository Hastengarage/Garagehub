<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GarageHub</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #131c2e;
      --card-inner: #0b111e;
      --accent: #f97316; /* Garage-orange */
      --accent-green: #22c55e;
      --text: #f8fafc;
      --text-dim: #94a3b8;
      --border: #1e293b;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 15px;
      font-size: 13px;
    }
    .container { max-width: 1050px; margin: 0 auto; }
    
    header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 15px; padding-bottom: 12px; border-bottom: 1px solid var(--border);
    }
    header h1 { font-size: 2.2rem; margin: 0; color: #fff; letter-spacing: -1px; font-weight: 800; }
    header h1 span { color: var(--accent); }
    
    /* Stats Bar */
    .stats-bar { display: flex; gap: 10px; margin-bottom: 15px; }
    .stat-card {
      background: var(--card-bg); border: 1px solid var(--border); padding: 8px 12px;
      border-radius: 6px; flex: 1; text-align: center;
    }
    .stat-card .val { font-size: 1.1rem; font-weight: bold; color: var(--accent); }
    .stat-card .lbl { font-size: 0.7rem; color: var(--text-dim); text-transform: uppercase; }

    /* Navigeringsflikar */
    .nav-tabs { display: flex; gap: 6px; margin-bottom: 15px; flex-wrap: wrap; }
    .nav-btn {
      background: var(--card-bg); border: 1px solid var(--border); color: var(--text-dim);
      padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; font-weight: 600;
    }
    .nav-btn.active, .nav-btn:hover { background: var(--accent); color: #000; border-color: var(--accent); }

    /* Paneler */
    .panel { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin-bottom: 15px; }
    .panel h2 { font-size: 1rem; margin-top: 0; margin-bottom: 10px; color: var(--accent); }

    /* Form & Inputs */
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin-bottom: 10px; }
    input, select, textarea {
      width: 100%; background: var(--card-inner); border: 1px solid var(--border);
      color: #fff; padding: 6px 8px; border-radius: 4px; font-size: 0.8rem; box-sizing: border-box;
    }
    button.btn-primary {
      background: var(--accent); color: #000; font-weight: bold; border: none;
      padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 0.8rem;
    }

    /* Taggar */
    .tags-container { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
    .tag { background: #1e293b; color: #fff; padding: 2px 6px; border-radius: 4px; font-size: 0.7rem; display: flex; align-items: center; gap: 4px; }
    .tag span { cursor: pointer; color: #f87171; font-weight: bold; }

    /* Märkes-chips */
    .brand-filter { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 10px; }
    .brand-chip {
      background: var(--card-inner); border: 1px solid var(--border); padding: 3px 8px;
      border-radius: 12px; font-size: 0.7rem; cursor: pointer; color: var(--text-dim);
    }
    .brand-chip.active { border-color: var(--accent); color: var(--accent); font-weight: bold; }

    /* Kompakta produktkort */
    .parts-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }
    .part-card {
      background: var(--card-inner); border: 1px solid var(--border); border-radius: 6px; padding: 10px; font-size: 0.8rem;
      display: flex; flex-direction: column; justify-content: space-between;
    }
    .part-card h3 { margin: 0 0 4px 0; font-size: 0.9rem; color: #fff; }
    .part-card .meta { color: var(--text-dim); font-size: 0.72rem; margin-bottom: 3px; }
    .part-card .price { color: var(--accent-green); font-weight: bold; font-size: 0.85rem; margin-top: 4px; }

    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Garage<span>Hub</span></h1>
      <button class="btn-primary" onclick="switchTab('membership')" style="background:var(--accent-green);">📝 Ansök / Kontakt</button>
    </header>

    <!-- Stats Bar -->
    <div class="stats-bar">
      <div class="stat-card"><div class="val" id="stat-cars">0</div><div class="lbl">Bilar i garage</div></div>
      <div class="stat-card"><div class="val" id="stat-parts">0</div><div class="lbl">Delar i lager</div></div>
      <div class="stat-card"><div class="val" id="stat-value">0 kr</div><div class="lbl">Totalt lagervärde</div></div>
    </div>

    <!-- Menylänkar -->
    <div class="nav-tabs">
      <button class="nav-btn active" onclick="switchTab('parts')">📦 Reservdelslager</button>
      <button class="nav-btn" onclick="switchTab('cars')">🏎️ Mina Bilar</button>
      <button class="nav-btn" onclick="switchTab('match')">⚡ Reg-nr Matchning</button>
    </div>

    <!-- SEKTION 1: Reservdelslager -->
    <div id="tab-parts" class="tab-content">
      <div class="panel">
        <h2>+ Lägg till reservdel</h2>
        <div style="display:flex; gap:6px; margin-bottom:8px;">
          <input type="text" id="part-reg-input" placeholder="Hämta från Reg-nr" style="max-width:160px; text-transform:uppercase;">
          <button class="btn-primary" onclick="lookupPartReg()">Sök Reg</button>
        </div>

        <div class="form-grid">
          <input type="text" id="part-name" placeholder="Delens namn">
          <input type="text" id="part-main-make" placeholder="Märke (t.ex. Volvo)">
          <input type="text" id="part-main-model" placeholder="Modell (t.ex. V70)">
          <input type="text" id="part-year" placeholder="Årsmodell / Intervall">
          <input type="number" id="part-price" placeholder="Pris (kr)">
        </div>

        <div style="margin-bottom:8px;">
          <label style="font-size:0.7rem; color:var(--text-dim);">Passar även andra bilmärken/modeller:</label>
          <div style="display:flex; gap:6px; margin-top:2px;">
            <input type="text" id="compat-input" placeholder="t.ex. Saab 9-3 eller Ford Focus 2.0" style="max-width:240px;">
            <button type="button" class="btn-primary" onclick="addCompatTag()" style="background:#334155; color:#fff;">+ Lägg till</button>
          </div>
          <div id="compat-tags" class="tags-container"></div>
        </div>

        <button class="btn-primary" onclick="addPart()">Spara del i lagret</button>
      </div>

      <div class="panel">
        <h2>Lagrade reservdelar</h2>
        
        <!-- SÖK & PRISFILTER -->
        <div style="display:flex; gap:8px; margin-bottom:10px; flex-wrap:wrap; background:var(--card-inner); padding:8px; border-radius:6px; border:1px solid var(--border);">
          <input type="text" id="search-filter" placeholder="🔍 Snaggsök delnamn/modell..." onkeyup="renderParts()" style="max-width:220px;">
          <input type="number" id="price-max-filter" placeholder="Maxpris (kr)" onkeyup="renderParts()" style="max-width:130px;">
          <select id="price-sort" onchange="renderParts()" style="max-width:150px;">
            <option value="none">Sortera pris</option>
            <option value="low-high">Lägst pris först</option>
            <option value="high-low">Högst pris först</option>
          </select>
        </div>

        <div class="brand-filter" id="brand-filters">
          <div class="brand-chip active" onclick="filterBrand('ALL')">Alla märken</div>
        </div>

        <div id="parts-list" class="parts-grid"></div>
      </div>
    </div>

    <!-- SEKTION 2: Mina Bilar -->
    <div id="tab-cars" class="tab-content hidden">
      <div class="panel">
        <h2>+ Slå upp &amp; spara bil</h2>
        <div style="display:flex; gap:6px; margin-bottom:8px;">
          <input type="text" id="car-reg-input" placeholder="Reg-nr (t.ex. BKU848)" style="max-width:160px; text-transform:uppercase;">
          <button class="btn-primary" onclick="lookupCarReg()">Slå upp full bildata</button>
        </div>
        
        <div class="form-grid">
          <input type="text" id="car-make" placeholder="Märke">
          <input type="text" id="car-model" placeholder="Modell">
          <input type="text" id="car-year" placeholder="Årsmodell">
          <input type="text" id="car-engine" placeholder="Motorkod / Volym">
          <input type="text" id="car-fuel" placeholder="Drivmedel (Bensin/Diesel)">
          <input type="text" id="car-power" placeholder="Effekt (Hk / kW)">
          <input type="text" id="car-gear" placeholder="Växellåda">
        </div>
        <button class="btn-primary" onclick="addCar()">Spara bil i garaget</button>
      </div>

      <div class="panel">
        <h2>Bilar i garaget</h2>
        <div id="car-list" class="parts-grid"></div>
      </div>
    </div>

    <!-- SEKTION 3: Reg-nr Matchning -->
    <div id="tab-match" class="tab-content hidden">
      <div class="panel">
        <h2>⚡ Reg-nr Matchning mot lager</h2>
        <p style="color:var(--text-dim); font-size:0.75rem;">Skriv in ett reg-nr för att se vilka delar i ditt lager som passar.</p>
        <div style="display:flex; gap:6px; margin-bottom:10px;">
          <input type="text" id="match-reg-input" placeholder="Reg-nr" style="max-width:180px; text-transform:uppercase;">
          <button class="btn-primary" onclick="matchRegWithInventory()">Hitta passande delar</button>
        </div>
        <div id="match-results-info" style="font-weight:bold; margin-bottom:8px;"></div>
        <div id="match-results-grid" class="parts-grid"></div>
      </div>
    </div>

    <!-- SEKTION 4: Ansökan & Kontakt -->
    <div id="tab-membership" class="tab-content hidden">
      <div class="panel">
        <h2>📝 Ansökan &amp; Kontakt</h2>
        <form onsubmit="submitApplication(event)">
          <div class="form-grid">
            <input type="text" id="app-name" placeholder="Ditt Namn" required>
            <input type="email" id="app-email" placeholder="E-postadress" required>
            <input type="tel" id="app-phone" placeholder="Telefonnummer" required>
            <select id="app-type">
              <option value="Reservdelsförfrågan">Reservdelsförfrågan</option>
              <option value="Ansökan Medlemskap">Ansökan om Medlemskap</option>
              <option value="Övrigt">Övrigt</option>
            </select>
          </div>
          <div style="margin-bottom:8px;">
            <textarea id="app-msg" rows="3" placeholder="Meddelande..."></textarea>
          </div>
          <button type="submit" class="btn-primary" style="background:var(--accent-green);">Skicka Meddelande</button>
        </form>
      </div>
    </div>

  </div>

  <script>
    let cars = [];
    let parts = [];
    let currentCompatTags = [];
    let selectedBrand = 'ALL';

    function switchTab(tab) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
      document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
      const btn = document.querySelector(`[onclick="switchTab('${tab}')"]`);
      if (btn) btn.classList.add('active');
      document.getElementById('tab-' + tab).classList.remove('hidden');
    }

    function updateStats() {
      document.getElementById('stat-cars').innerText = cars.length;
      document.getElementById('stat-parts').innerText = parts.length;
      const totalVal = parts.reduce((sum, p) => sum + (parseInt(p.price) || 0), 0);
      document.getElementById('stat-value').innerText = totalVal.toLocaleString() + ' kr';
    }

    /* FULL FLÄSK REG-NR SÖKNING */
    async function lookupCarReg() {
      const reg = document.getElementById('car-reg-input').value;
      if (!reg) return alert('Skriv ett reg-nummer!');
      const res = await fetch('/api/car-info?reg=' + reg);
      const data = await res.json();
      if (data.success) {
        document.getElementById('car-make').value = data.make || '';
        document.getElementById('car-model').value = data.model || '';
        document.getElementById('car-year').value = data.year || '';
        document.getElementById('car-engine').value = data.engine || '';
        document.getElementById('car-fuel').value = data.fuel || '';
        document.getElementById('car-power').value = data.power || '';
        document.getElementById('car-gear').value = data.gearbox || '';
      }
    }

    async function lookupPartReg() {
      const reg = document.getElementById('part-reg-input').value;
      if (!reg) return alert('Skriv ett reg-nummer!');
      const res = await fetch('/api/car-info?reg=' + reg);
      const data = await res.json();
      if (data.success) {
        document.getElementById('part-main-make').value = data.make || '';
        document.getElementById('part-main-model').value = data.model || '';
        document.getElementById('part-year').value = data.year || '';
      }
    }

    /* TAGGAR */
    function addCompatTag() {
      const val = document.getElementById('compat-input').value.trim();
      if (val && !currentCompatTags.includes(val)) {
        currentCompatTags.push(val);
        document.getElementById('compat-input').value = '';
        renderTags();
      }
    }

    function removeTag(tag) {
      currentCompatTags = currentCompatTags.filter(t => t !== tag);
      renderTags();
    }

    function renderTags() {
      document.getElementById('compat-tags').innerHTML = currentCompatTags.map(t => 
        `<div class="tag">${t} <span onclick="removeTag('${t}')">&times;</span></div>`
      ).join('');
    }

    /* BILAR */
    function addCar() {
      const make = document.getElementById('car-make').value;
      const model = document.getElementById('car-model').value;
      if (!make || !model) return alert('Fyll i märke och modell!');
      
      cars.push({
        reg: document.getElementById('car-reg-input').value.toUpperCase(),
        make, model,
        year: document.getElementById('car-year').value,
        engine: document.getElementById('car-engine').value,
        fuel: document.getElementById('car-fuel').value,
        power: document.getElementById('car-power').value,
        gearbox: document.getElementById('car-gear').value
      });
      renderCars();
      updateStats();
    }

    function renderCars() {
      document.getElementById('car-list').innerHTML = cars.map(c => `
        <div class="part-card">
          <h3>${c.make} ${c.model} (${c.year})</h3>
          <div class="meta"><b>Reg:</b> ${c.reg || 'Ej angivet'}</div>
          <div class="meta"><b>Motor:</b> ${c.engine} (${c.fuel})</div>
          <div class="meta"><b>Effekt:</b> ${c.power} | <b>Låda:</b> ${c.gearbox}</div>
        </div>
      `).join('');
    }

    /* RESERVDELAR MED SNABBSÖK OCH PRISFILTER */
    function addPart() {
      const name = document.getElementById('part-name').value;
      const make = document.getElementById('part-main-make').value;
      if (!name || !make) return alert('Fyll i delens namn och märke!');

      parts.push({
        name, make,
        model: document.getElementById('part-main-model').value,
        year: document.getElementById('part-year').value,
        price: parseInt(document.getElementById('part-price').value) || 0,
        compat: [...currentCompatTags]
      });

      currentCompatTags = [];
      renderTags();
      renderBrandFilters();
      renderParts();
      updateStats();
    }

    function renderBrandFilters() {
      const brands = ['ALL', ...new Set(parts.map(p => p.make.toUpperCase()))];
      document.getElementById('brand-filters').innerHTML = brands.map(b => `
        <div class="brand-chip ${selectedBrand === b ? 'active' : ''}" onclick="filterBrand('${b}')">${b === 'ALL' ? 'Alla märken' : b}</div>
      `).join('');
    }

    function filterBrand(b) {
      selectedBrand = b;
      renderBrandFilters();
      renderParts();
    }

    function renderParts() {
      const search = document.getElementById('search-filter').value.toLowerCase();
      const maxPrice = parseInt(document.getElementById('price-max-filter').value) || Infinity;
      const priceSort = document.getElementById('price-sort').value;

      let filtered = parts.filter(p => {
        const matchBrand = (selectedBrand === 'ALL' || p.make.toUpperCase() === selectedBrand);
        const matchSearch = p.name.toLowerCase().includes(search) || p.model.toLowerCase().includes(search);
        const matchPrice = p.price <= maxPrice;
        return matchBrand && matchSearch && matchPrice;
      });

      if (priceSort === 'low-high') filtered.sort((a,b) => a.price - b.price);
      if (priceSort === 'high-low') filtered.sort((a,b) => b.price - a.price);

      document.getElementById('parts-list').innerHTML = filtered.map(p => `
        <div class="part-card">
          <div>
            <h3>${p.name}</h3>
            <div class="meta"><b>Passar:</b> ${p.make} ${p.model} (${p.year})</div>
            ${p.compat.length ? `<div class="meta"><b>Även:</b> ${p.compat.join(', ')}</div>` : ''}
          </div>
          <div class="price">${p.price ? p.price + ' kr' : 'Pris saknas'}</div>
        </div>
      `).join('');
    }

    /* MATCHNING */
    async function matchRegWithInventory() {
      const reg = document.getElementById('match-reg-input').value;
      if (!reg) return;
      const res = await fetch('/api/car-info?reg=' + reg);
      const car = await res.json();
      if (!car.success) return alert('Kunde inte slå upp reg-numret.');

      document.getElementById('match-results-info').innerText = `Söker delar till: ${car.make} ${car.model} (${car.year})`;

      const matches = parts.filter(p => {
        const makeMatch = p.make.toLowerCase() === car.make.toLowerCase();
        const modelMatch = p.model.toLowerCase() === car.model.toLowerCase();
        const compatMatch = p.compat.some(c => c.toLowerCase().includes(car.make.toLowerCase()));
        return (makeMatch && modelMatch) || compatMatch;
      });

      document.getElementById('match-results-grid').innerHTML = matches.length ? matches.map(p => `
        <div class="part-card" style="border-color:var(--accent-green);">
          <h3>${p.name}</h3>
          <div class="meta"><b>Huvudmodell:</b> ${p.make} ${p.model}</div>
          <div class="price">${p.price ? p.price + ' kr' : ''}</div>
        </div>
      `).join('') : '<p style="color:var(--text-dim);">Inga matchande delar hittades i lagret.</p>';
    }

    function submitApplication(e) {
      e.preventDefault();
      alert('Tack! Ditt meddelande har skickats.');
      e.target.reset();
    }
  </script>
</body>
</html>
